
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godzilla Addon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background:
                linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.8)),
                url("https://klipy.com/gifs/godzilla-ultima-godzilla-singular-point")
                center / cover no-repeat;
        }

        .container {
            text-align: center;
            color: white;
            padding: 40px;
        }

        h1 {
            font-size: clamp(45px, 9vw, 90px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #ff2929;
            text-shadow:
                0 0 10px #ff0000,
                0 0 30px #ff0000,
                4px 4px 5px black;
            margin-bottom: 35px;
        }

        .community {
            display: inline-block;
            padding: 17px 45px;
            background: #e32626;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            border: 2px solid #ff5555;
            box-shadow: 0 0 20px #ff0000;
            transition: 0.3s;
        }

        .community:hover {
            background: #ff4444;
            transform: scale(1.1);
            box-shadow: 0 0 35px red;
        }

        .subtitle {
            color: #ddd;
            font-size: 18px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Godzilla Addon</h1>

        <p class="subtitle">
            THE KING OF MONSTERS
        </p>

        <a class="community"
           href="https://discord.gg/eqWnW8MHpC"
           target="_blank"
           rel="noopener noreferrer">
            Comunidad
        </a>
    </div>

</body>
</html>
